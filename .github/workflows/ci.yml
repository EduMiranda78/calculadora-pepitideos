name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate JavaScript
        run: node --check app.js

      - name: Validate required files
        run: |
          test -f index.html
          test -f styles.css
          test -f app.js
          test -f README.md
          test -f SECURITY.md
          test -f CHANGELOG.md
          test -f CONTRIBUTING.md
          test -f VERSION
